[project]
name = "grecis"
version = "0.1.0"
description = "Graduate Reading Corpus Intelligence System for Chinese postgraduate English reading preparation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "GRECIS" }]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "feedparser>=6.0.0",
  "fastapi>=0.116.0",
  "openai>=1.90.0",
  "pandas>=2.2.0",
  "pypdf>=5.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.32.0",
  "wordfreq>=3.1.1",
  "trafilatura>=1.12.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[project.scripts]
grecis = "grecis.cli:main"
grecis-web = "grecis.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grecis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
