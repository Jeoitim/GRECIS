database:
  path: data/grecis.sqlite

output:
  markdown_dir: output/markdown
  redbook_dir: output/redbook

llm:
  model: gpt-4.1-mini
  base_url: ""
  api_key: ""

crawler:
  user_agent: "GRECIS/0.1 (+local research corpus)"
  request_timeout_seconds: 20
  delay_seconds: 1.0
  max_articles_per_source: 50
  target_article_count: 1000
  min_text_chars: 800
  min_exam_value: 4.5
  min_difficulty: 3.5
  min_quality_score: 6.0
  candidate_multiplier: 8
  max_discovery_pages_per_source: 60
  max_search_pages_per_query: 2

sources:
  - name: The Economist
    enabled: true
    field_hint: economics
    category: economy
    reliability: 0.98
    quality_weight: 0.7
    prefer_keywords: [economy, business, finance, market, regulation, technology, climate, education]
    exclude_keywords: [sport, football, cricket, celebrity, crossword, puzzle]
    feed_urls:
      - https://www.economist.com/rss
    archive_urls:
      - https://www.economist.com/finance-and-economics
      - https://www.economist.com/business
      - https://www.economist.com/science-and-technology
      - https://www.economist.com/international
      - https://www.economist.com/briefing
    search_url_templates:
      - https://www.economist.com/search?q={query_plus}
    topic_queries: [behavioral economics, climate policy, education reform, antitrust, technology regulation]
    article_url_patterns:
      - "economist\\.com/.+/[0-9]{4}/[0-9]{2}/[0-9]{2}/"

  - name: Financial Times
    enabled: true
    field_hint: economics
