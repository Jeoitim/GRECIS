database:
  path: data/grecis.sqlite

output:
  markdown_dir: output/markdown
  redbook_dir: output/redbook

llm:
  model: gpt-4.1-mini
  base_url: ""
  api_key: ""

crawler:
  user_agent: "GRECIS/0.1 (+local research corpus)"
  request_timeout_seconds: 20
  delay_seconds: 1.0
  max_articles_per_source: 50
  target_article_count: 1000
  min_text_chars: 800
  min_exam_value: 4.5
  min_difficulty: 3.5
  min_quality_score: 6.0

sources:
  - name: The Economist
    enabled: true
    field_hint: economics
    category: economy
    reliability: 0.98
    quality_weight: 0.7
    prefer_keywords: [economy, business, finance, market, regulation, technology, climate, education]
    exclude_keywords: [sport, football, cricket, celebrity, crossword, puzzle]
    feed_urls:
      - https://www.economist.com/rss

  - name: Financial Times
    enabled: true
    field_hint: economics
    category: economy
    reliability: 0.97
    quality_weight: 0.7
    prefer_keywords: [markets, companies, economy, opinion, technology, climate]
    exclude_keywords: [sport, luxury, travel]
    feed_urls:
      - https://www.ft.com/rss/home

  - name: Wall Street Journal
    enabled: true
    field_hint: economics
    category: economy
    reliability: 0.96
    quality_weight: 0.7
    prefer_keywords: [economy, business, markets, politics, technology]
    exclude_keywords: [sports, lifestyle, celebrity]
    feed_urls:
      - https://feeds.a.dj.com/rss/RSSWorldNews.xml
      - https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml

  - name: Bloomberg Businessweek
    enabled: true
    field_hint: economics
    category: economy
    reliability: 0.93
    quality_weight: 0.65
    prefer_keywords: [businessweek, business, economics, technology, markets]
    exclude_keywords: [pursuits, travel]
